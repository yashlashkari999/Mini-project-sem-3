    // --- MAIN REACT APPLICATION COMPONENT ---
    function App() {
      // LocalStorage State persistence
      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem('sb_users');
        return saved ? JSON.parse(saved) : INITIAL_USERS;
      });

      const [currentUserId, setCurrentUserId] = useState(() => {
        const saved = localStorage.getItem('sb_current_user');
        return saved || 'usr_aarav';
      });

      const [skills, setSkills] = useState(() => {
        const saved = localStorage.getItem('sb_skills');
        return saved ? JSON.parse(saved) : INITIAL_SKILLS;
      });

      const [ledger, setLedger] = useState(() => {
        const saved = localStorage.getItem('sb_ledger');
        return saved ? JSON.parse(saved) : INITIAL_LEDGER;
      });

      const [sessions, setSessions] = useState(() => {
        const saved = localStorage.getItem('sb_sessions');
        return saved ? JSON.parse(saved) : INITIAL_SESSIONS;
      });

      // Navigation & view states: 'landing', 'marketplace', 'dashboard'
      const [currentView, setCurrentView] = useState('marketplace');
      const [dashboardTab, setDashboardTab] = useState('profile'); // 'profile', 'ledger', 'sessions', 'add-skill'

      // Search & Filters for Marketplace
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All Categories');
      const [skillTypeFilter, setSkillTypeFilter] = useState('all'); // 'all', 'teaching', 'learning'
      const [sortBy, setSortBy] = useState('newest'); // 'newest', 'rating'

      // Modals
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' or 'signup'
      const [bookingModalSkill, setBookingModalSkill] = useState(null);
      const [completionModalSession, setCompletionModalSession] = useState(null);
      const [toast, setToast] = useState(null);

      // Save state to LocalStorage
      useEffect(() => {
        localStorage.setItem('sb_users', JSON.stringify(users));
      }, [users]);

      useEffect(() => {
        localStorage.setItem('sb_current_user', currentUserId);
      }, [currentUserId]);

      useEffect(() => {
        localStorage.setItem('sb_skills', JSON.stringify(skills));
      }, [skills]);

      useEffect(() => {
        localStorage.setItem('sb_ledger', JSON.stringify(ledger));
      }, [ledger]);

      useEffect(() => {
        localStorage.setItem('sb_sessions', JSON.stringify(sessions));
      }, [sessions]);

      // Re-trigger Lucide icons on render
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Current active user object
      const currentUser = useMemo(() => {
        return users.find(u => u.id === currentUserId) || users[0];
      }, [users, currentUserId]);

      // Helper to show toasts
      const showToast = (message, type = 'success') => {
        setToast({ message, type, id: Date.now() });
        setTimeout(() => {
          setToast(null);
        }, 4000);
      };

      // Switch active persona
      const handleSwitchUser = (userId) => {
        setCurrentUserId(userId);
        const switched = users.find(u => u.id === userId);
        showToast(`Switched active account to ${switched?.name} (${switched?.creditBalance} Credits)`, 'info');
      };

      // Reset application data to defaults
      const handleResetData = () => {
        if (window.confirm("Reset all platform data back to campus defaults?")) {
          setUsers(INITIAL_USERS);
          setCurrentUserId('usr_aarav');
          setSkills(INITIAL_SKILLS);
          setLedger(INITIAL_LEDGER);
          setSessions(INITIAL_SESSIONS);
          localStorage.clear();
          showToast("Campus demo data successfully reset!", "info");
        }
      };

      // Create a new Barter / Session Booking Proposal
      const handleCreateBooking = (bookingData) => {
        const { skill, date, time, locationType, locationDetails, notes } = bookingData;
        
        // Determine teacher and learner depending on skill type
        let teacherId, teacherName, teacherAvatar, learnerId, learnerName, learnerAvatar;
        
        if (skill.type === 'teaching') {
          // The skill owner is teaching; currentUser is learning
          if (currentUser.creditBalance < 1) {
            showToast("Insufficient credits! You need at least 1 credit to book a mentor. Teach a skill to earn credits first!", "error");
            return;
          }
          teacherId = skill.userId;
          teacherName = skill.userName;
          teacherAvatar = skill.userAvatar;
          learnerId = currentUser.id;
          learnerName = currentUser.name;
          learnerAvatar = currentUser.avatar;
        } else {
          // The skill owner was requesting a tutor (learning); currentUser is offering to teach
          teacherId = currentUser.id;
          teacherName = currentUser.name;
          teacherAvatar = currentUser.avatar;
          learnerId = skill.userId;
          learnerName = skill.userName;
          learnerAvatar = skill.userAvatar;
        }

        const newSession = {
          id: 'ses_' + Math.random().toString(36).substr(2, 9),
          skillId: skill.id,
          skillTitle: skill.title,
          teacherId,
          teacherName,
          teacherAvatar,
          learnerId,
          learnerName,
          learnerAvatar,
          status: 'pending',
          scheduledDate: date,
          scheduledTime: time,
          durationHours: 1,
          locationType,
          locationDetails,
          notes,
          creditAmount: 1,
          createdAt: new Date().toISOString()
        };

        setSessions([newSession, ...sessions]);
        setBookingModalSkill(null);
        showToast(`Barter proposal sent to ${skill.type === 'teaching' ? skill.userName : skill.userName}!`, 'success');
        
        // Switch view to dashboard sessions tab so user sees the new booking
        setCurrentView('dashboard');
        setDashboardTab('sessions');
      };

      // Accept a pending proposal (by the teacher or partner)
      const handleAcceptSession = (sessionId) => {
        setSessions(sessions.map(s => s.id === sessionId ? { ...s, status: 'confirmed' } : s));

            const currentRatingsCount = u.reviewsCount || 0;
            const newRating = Number((((u.rating || 5) * currentRatingsCount + rating) / (currentRatingsCount + 1)).toFixed(2));
            return {
              ...u,
              creditBalance: u.creditBalance + 1,
              sessionsTaught: newTotalTaught,
              rating: newRating,
              reviewsCount: currentRatingsCount + 1

            return {
              ...u,
              creditBalance: u.creditBalance - 1,
              sessionsLearned: (u.sessionsLearned || 0) + 1
            };

          sessionId: sessionId,
          timestamp: timestamp,
          balanceAfter: teacher.creditBalance + 1,

              status: 'completed',
              completedAt: timestamp,
              ratingGiven: rating,
              reviewText: reviewText

                  e.preventDefault();
                  const formData = new FormData(e.target);
                  const rating = Number(formData.get('rating') || 5);
                  const review = formData.get('review') || 'Great peer session!';
                  handleCompleteSession(completionModalSession, rating, review);
                }} className="space-y-4">
                  
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Student Rating</label>
                    <select
                      name="rating"
                      defaultValue="5"
                      className="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-brand-500"
                    >
                      <option value="5">★★★★★ 5 Stars (Exceptional Mentor)</option>
                      <option value="4">★★★★☆ 4 Stars (Very Good)</option>
                      <option value="3">★★★☆☆ 3 Stars (Satisfactory)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Feedback / Testimonial</label>
                    <textarea
                      name="review"
                      rows="2"
                      required
                      defaultValue="Very helpful and clear explanation. Highly recommend!"
                      className="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-brand-500"
                    ></textarea>
                  </div>

                  <div className="pt-2">
                    <button
                      type="submit"
                      className="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md transition"
                    >
                      Verify & Settle Time-Bank Credits
                    </button>
                  </div>

                </form>

              </div>
            </div>
          )}

          {/* AUTHENTICATION MODAL (SIGN IN / SIGN UP) */}
          {isAuthModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 border border-slate-200 shadow-2xl relative animate-in fade-in zoom-in-95">
                
                <button
                  onClick={() => setIsAuthModalOpen(false)}
                  className="absolute right-5 top-5 text-slate-400 hover:text-slate-700"
                >
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>

                {/* Tabs for Login vs Register */}
                <div className="flex border-b border-slate-200 mb-6 text-sm font-bold">
                  <button
                    onClick={() => setAuthMode('login')}
                    className={`flex-1 pb-3 text-center border-b-2 transition ${
                      authMode === 'login' ? 'border-brand-600 text-brand-600' : 'border-transparent text-slate-400 hover:text-slate-700'
                    }`}
                  >
                    Campus Login
                  </button>
                  <button
                    onClick={() => setAuthMode('signup')}
                    className={`flex-1 pb-3 text-center border-b-2 transition ${
                      authMode === 'signup' ? 'border-brand-600 text-brand-600' : 'border-transparent text-slate-400 hover:text-slate-700'
                    }`}
                  >
                    New Student Sign Up
                  </button>
                </div>

                {authMode === 'login' ? (
                  /* LOGIN FORM */
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    handleLogin(formData.get('email'));
                  }} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Campus Email</label>
                      <input
                        type="email"
                        name="email"
                        required
                        defaultValue={currentUser.email}
                        placeholder="e.g. aarav.sharma@campus.edu"
                        className="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-brand-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Password</label>
                      <input
                        type="password"
                        name="password"
                        required
                        defaultValue="student123"
                        className="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-brand-500"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-md transition"
                    >
                      Sign In to Time-Bank
                    </button>

                    <div className="pt-2 text-center text-xs text-slate-400">
                      Or quickly select a student persona from the top simulator bar.
                    </div>
                  </form>
                ) : (
                  /* SIGN UP FORM */
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    handleSignUp({
                      name: formData.get('name'),
                      email: formData.get('email'),
                      major: formData.get('major'),
                      gradYear: formData.get('gradYear'),
                      bio: formData.get('bio')
                    });
                  }} className="space-y-3.5">
                    
                    <div className="p-3 bg-amber-50 rounded-xl border border-amber-200 text-amber-900 text-xs flex items-center gap-2">
                      <span className="text-base">🎁</span>
                      <span><strong>Campus Verification Bonus:</strong> You receive 3 free time credits upon registration!</span>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Full Student Name</label>
                      <input
                        type="text"
                        name="name"
                        required
                        placeholder="e.g. Maya Lin"
                        className="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-brand-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Campus Email (.edu / university)</label>
                      <input
                        type="email"
                        name="email"
                        required
                        placeholder="maya.lin@campus.edu"
                        className="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-brand-500"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Major / Department</label>
                        <input
                          type="text"
                          name="major"
                          required
                          placeholder="e.g. Bioengineering"
                          className="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-brand-500"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Graduation Year</label>
                        <input
                          type="text"
                          name="gradYear"
                          required
                          placeholder="2027"
                          className="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-brand-500"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Short Bio</label>
                      <input
                        type="text"
                        name="bio"
                        placeholder="What do you love studying or teaching?"
                        className="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-brand-500"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-md transition"
                    >
                      Complete Sign-Up & Claim 3 Credits
                    </button>
                  </form>
                )}

              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="mt-auto bg-white border-t border-slate-200 py-8 text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="font-bold text-slate-800">SkillBarter Campus</span>
                <span>•</span>
                <span>On-Campus Peer Time-Banking Network</span>
              </div>
              <div className="flex items-center gap-4">
                <span>Semester 3 Mini Project</span>
                <span>•</span>
                <span>1 Hour Taught = +1 Credit | 1 Hour Learned = -1 Credit</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Render the React application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
